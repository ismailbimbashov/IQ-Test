# Production-like local run: docker compose up --build, then open http://localhost:8080
services:
  web:
    build: .
    image: cognitive-index:local
    ports:
      - '8080:8080'
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
